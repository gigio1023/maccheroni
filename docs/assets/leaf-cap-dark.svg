<svg viewBox="0 0 1560 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why ASR leaves are capped at 120 seconds">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="56" font-size="30" font-weight="600" fill="#F2F2F7">Why ASR leaves are capped at 120 seconds</text>
    <text x="64" y="92" font-size="18" fill="#A6A6B3">Canonical end-of-sequence leaves per configuration on the same 600-second synthetic Italian input, MOSS 0.9B INT8 at the pinned revision.</text>

    <g font-size="13" fill="#6E6E7A" text-anchor="end">
      <text x="168" y="420">1</text>
      <text x="168" y="365">2</text>
      <text x="168" y="311">3</text>
      <text x="168" y="256">4</text>
      <text x="168" y="202">5</text>
    </g>
    <g stroke="#2E2E38" stroke-width="1">
      <line x1="180" y1="415" x2="1450" y2="415"/>
      <line x1="180" y1="361" x2="1450" y2="361"/>
      <line x1="180" y1="306" x2="1450" y2="306"/>
      <line x1="180" y1="252" x2="1450" y2="252"/>
      <line x1="180" y1="197" x2="1450" y2="197"/>
    </g>
    <line x1="180" y1="470" x2="1450" y2="470" stroke="#4A4A55" stroke-width="1.5"/>

    <!-- 120 s -->
    <rect x="245" y="197" width="120" height="273" rx="6" fill="#2FBF91"/>
    <text x="305" y="184" font-size="22" font-weight="600" fill="#F2F2F7" text-anchor="middle">5</text>
    <text x="305" y="504" font-size="17" font-weight="600" fill="#C9C9D4" text-anchor="middle">120 s leaves</text>
    <text x="305" y="528" font-size="14.5" fill="#8A8A96" text-anchor="middle">pass: CER 0.036, term recall 0.778</text>

    <!-- 240 s -->
    <rect x="585" y="434" width="120" height="36" rx="6" fill="none" stroke="#F0793C" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="645" y="422" font-size="15" fill="#F0793C" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">invalid_eos_output</text>
    <text x="645" y="504" font-size="17" font-weight="600" fill="#C9C9D4" text-anchor="middle">240 s leaves</text>
    <text x="645" y="528" font-size="14.5" fill="#8A8A96" text-anchor="middle">0 valid leaves: typed failure, never promoted</text>

    <!-- 300 s -->
    <rect x="925" y="434" width="120" height="36" rx="6" fill="none" stroke="#F0793C" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="985" y="422" font-size="15" fill="#F0793C" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">invalid_eos_output</text>
    <text x="985" y="504" font-size="17" font-weight="600" fill="#C9C9D4" text-anchor="middle">300 s leaves</text>
    <text x="985" y="528" font-size="14.5" fill="#8A8A96" text-anchor="middle">0 valid leaves: typed failure, never promoted</text>

    <!-- 240 s + forced recovery -->
    <rect x="1265" y="197" width="120" height="273" rx="6" fill="#2FBF91"/>
    <text x="1325" y="184" font-size="22" font-weight="600" fill="#F2F2F7" text-anchor="middle">5</text>
    <text x="1325" y="504" font-size="17" font-weight="600" fill="#C9C9D4" text-anchor="middle">240 s + forced recovery</text>
    <text x="1325" y="528" font-size="14.5" fill="#8A8A96" text-anchor="middle">recovered as five 120 s children: CER 0.036</text>

    <text x="64" y="580" font-size="14.5" fill="#8A8A96">Truncated output is never promoted: a leaf that stops without end-of-sequence is a typed failure, not a shorter transcript. Full matrix, gates, and evaluation seals: docs/moss-long-audio-verdict.md.</text>
  </g>
</svg>
