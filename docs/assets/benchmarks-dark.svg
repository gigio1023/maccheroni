<svg viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Measured accuracy on public and synthetic fixtures">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="56" font-size="30" font-weight="600" fill="#F2F2F7">Measured on public and synthetic fixtures</text>
    <text x="64" y="92" font-size="18" fill="#A6A6B3">Pinned models, decode-time glossary injection on. Evaluation IDs and artifact hashes are recorded in docs/.</text>

    <!-- Panel 1: error rates -->
    <text x="64" y="150" font-size="19" font-weight="600" fill="#F2F2F7">Error rate (lower is better)</text>
    <g font-size="13" fill="#6E6E7A" text-anchor="end">
      <text x="102" y="441">0.05</text>
      <text x="102" y="317">0.10</text>
      <text x="102" y="194">0.15</text>
    </g>
    <g stroke="#2E2E38" stroke-width="1">
      <line x1="112" y1="437" x2="488" y2="437"/>
      <line x1="112" y1="313" x2="488" y2="313"/>
      <line x1="112" y1="190" x2="488" y2="190"/>
    </g>
    <line x1="112" y1="560" x2="488" y2="560" stroke="#4A4A55" stroke-width="1.5"/>
    <rect x="183" y="360" width="52" height="200" rx="5" fill="#E8814A"/>
    <rect x="249" y="244" width="52" height="316" rx="5" fill="#E9C08C"/>
    <rect x="343" y="479" width="52" height="81" rx="5" fill="#E8814A"/>
    <rect x="409" y="360" width="52" height="200" rx="5" fill="#E9C08C"/>
    <g font-size="17" font-weight="600" fill="#F2F2F7" text-anchor="middle">
      <text x="209" y="348">0.081</text>
      <text x="275" y="232">0.128</text>
      <text x="369" y="467">0.033</text>
      <text x="435" y="348">0.081</text>
    </g>
    <g text-anchor="middle">
      <text x="242" y="592" font-size="16" fill="#C9C9D4">Korean dialogue</text>
      <text x="242" y="614" font-size="14" fill="#8A8A96">VibeVoice 8-bit</text>
      <text x="402" y="592" font-size="16" fill="#C9C9D4">Italian 2-speaker</text>
      <text x="402" y="614" font-size="14" fill="#8A8A96">MOSS 0.9B INT8</text>
    </g>
    <rect x="382" y="139" width="13" height="13" rx="3" fill="#E8814A"/>
    <text x="401" y="151" font-size="14" fill="#A6A6B3">CER</text>
    <rect x="440" y="139" width="13" height="13" rx="3" fill="#E9C08C"/>
    <text x="459" y="151" font-size="14" fill="#A6A6B3">WER</text>

    <!-- Panel 2: term recall -->
    <text x="544" y="150" font-size="19" font-weight="600" fill="#F2F2F7">Glossary term recall (higher is better)</text>
    <g font-size="13" fill="#6E6E7A" text-anchor="end">
      <text x="582" y="472">0.25</text>
      <text x="582" y="379">0.50</text>
      <text x="582" y="286">0.75</text>
      <text x="582" y="194">1.00</text>
    </g>
    <g stroke="#2E2E38" stroke-width="1">
      <line x1="592" y1="468" x2="968" y2="468"/>
      <line x1="592" y1="375" x2="968" y2="375"/>
      <line x1="592" y1="190" x2="968" y2="190"/>
    </g>
    <line x1="592" y1="282" x2="968" y2="282" stroke="#7A7A88" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="596" y="274" font-size="13.5" fill="#8A8A96">fixed-evaluation gate 0.75</text>
    <line x1="592" y1="560" x2="968" y2="560" stroke="#4A4A55" stroke-width="1.5"/>
    <rect x="686" y="208" width="72" height="352" rx="5" fill="#2FBF91"/>
    <rect x="846" y="272" width="72" height="288" rx="5" fill="#2FBF91"/>
    <g font-size="17" font-weight="600" fill="#F2F2F7" text-anchor="middle">
      <text x="722" y="196">0.95</text>
      <text x="882" y="260">0.778</text>
    </g>
    <g text-anchor="middle">
      <text x="722" y="592" font-size="16" fill="#C9C9D4">Korean dialogue</text>
      <text x="722" y="614" font-size="14" fill="#8A8A96">20-term glossary</text>
      <text x="882" y="592" font-size="16" fill="#C9C9D4">Italian 2-speaker</text>
      <text x="882" y="614" font-size="14" fill="#8A8A96">9-term glossary</text>
    </g>

    <!-- Panel 3: diarization error rate -->
    <text x="1024" y="150" font-size="19" font-weight="600" fill="#F2F2F7">Diarization error rate (lower is better)</text>
    <g font-size="13" fill="#6E6E7A" text-anchor="end">
      <text x="1062" y="472">0.05</text>
      <text x="1062" y="379">0.10</text>
      <text x="1062" y="286">0.15</text>
      <text x="1062" y="194">0.20</text>
    </g>
    <g stroke="#2E2E38" stroke-width="1">
      <line x1="1072" y1="468" x2="1448" y2="468"/>
      <line x1="1072" y1="375" x2="1448" y2="375"/>
      <line x1="1072" y1="282" x2="1448" y2="282"/>
      <line x1="1072" y1="190" x2="1448" y2="190"/>
    </g>
    <line x1="1072" y1="560" x2="1448" y2="560" stroke="#4A4A55" stroke-width="1.5"/>
    <rect x="1166" y="471" width="72" height="89" rx="5" fill="#94A3B8"/>
    <rect x="1326" y="279" width="72" height="281" rx="5" fill="#94A3B8"/>
    <g font-size="17" font-weight="600" fill="#F2F2F7" text-anchor="middle">
      <text x="1202" y="459">0.048</text>
      <text x="1362" y="267">0.152</text>
    </g>
    <g text-anchor="middle">
      <text x="1202" y="592" font-size="16" fill="#C9C9D4">Italian 2-speaker</text>
      <text x="1202" y="614" font-size="14" fill="#8A8A96">10 min, synthetic</text>
      <text x="1362" y="592" font-size="16" fill="#C9C9D4">VoxConverse sample</text>
      <text x="1362" y="614" font-size="14" fill="#8A8A96">78 min, public</text>
    </g>

    <text x="64" y="672" font-size="14.5" fill="#8A8A96">Korean dialogue: VibeVoice ASR 8-bit with a 20-term glossary. Italian synthetic two-speaker: MOSS 0.9B MLX INT8 with a 9-term glossary, whole-file diarization by Pyannote Community CoreML.</text>
    <text x="64" y="696" font-size="14.5" fill="#8A8A96">Chunk-boundary speaker stability on the 78-minute sample: 1.0 for both reference speakers across all root boundaries.</text>
  </g>
</svg>
